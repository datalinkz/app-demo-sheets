<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>All Submissions — DataLinkz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    :root {
      --accent: #7c5cfc;
      --accent-light: #a78bfa;
      --accent-glow: rgba(124, 92, 252, 0.35);
      --surface: rgba(255, 255, 255, 0.04);
      --surface-border: rgba(255, 255, 255, 0.07);
      --surface-hover: rgba(255, 255, 255, 0.08);
      --text: #f0f0f5;
      --text-muted: #8b8b9e;
      --text-dim: #56566a;
      --danger: #f87171;
    }

    body {
      font-family: "Inter", system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      color: var(--text);
      overflow-x: hidden;
      background: #0a0a12;
    }

    /* ── Animated background ─────────────────── */
    .bg {
      position: fixed; inset: 0; z-index: 0;
      background: #0a0a12;
      overflow: hidden;
    }

    .bg .orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(100px);
      opacity: 0.5;
      animation: float 18s ease-in-out infinite alternate;
    }

    .bg .orb:nth-child(1) {
      width: 600px; height: 600px;
      background: radial-gradient(circle, #7c5cfc 0%, transparent 70%);
      top: -15%; left: -10%;
      animation-duration: 20s;
    }

    .bg .orb:nth-child(2) {
      width: 500px; height: 500px;
      background: radial-gradient(circle, #3b82f6 0%, transparent 70%);
      bottom: -20%; right: -10%;
      animation-duration: 24s;
      animation-delay: -6s;
    }

    .bg .orb:nth-child(3) {
      width: 350px; height: 350px;
      background: radial-gradient(circle, #ec4899 0%, transparent 70%);
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      animation-duration: 16s;
      animation-delay: -3s;
      opacity: 0.3;
    }

    @keyframes float {
      0%   { transform: translate(0, 0) scale(1); }
      50%  { transform: translate(40px, -30px) scale(1.08); }
      100% { transform: translate(-20px, 20px) scale(0.95); }
    }

    /* ── Top bar ─────────────────────────────── */
    .topbar {
      position: fixed;
      top: 1.25rem;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 0.25rem;
      padding: 0.3rem;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 14px;
      backdrop-filter: blur(20px);
      box-shadow: 0 4px 24px rgba(0, 0, 0, 0.3);
      animation: slideDown 0.5s ease-out both;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateX(-50%) translateY(-20px); }
      to   { opacity: 1; transform: translateX(-50%) translateY(0); }
    }

    .topbar a, .topbar button {
      text-decoration: none;
      font-family: inherit;
      font-size: 0.82rem;
      font-weight: 600;
      padding: 0.55rem 1.2rem;
      border-radius: 10px;
      color: var(--text-muted);
      background: none;
      border: none;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .topbar a:hover, .topbar button:hover {
      color: var(--text);
      background: rgba(255, 255, 255, 0.06);
    }

    .topbar a.active {
      color: #fff;
      background: var(--accent);
      box-shadow: 0 2px 12px var(--accent-glow);
    }

    .topbar .logout-btn {
      color: #f87171;
    }

    .topbar .logout-btn:hover {
      background: rgba(248, 113, 113, 0.1);
      color: #fca5a5;
    }

    /* ── Layout ──────────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      min-height: 100vh;
      padding: 5.5rem 1.5rem 2.5rem;
    }

    .container {
      max-width: 720px;
      margin: 0 auto;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Page header ─────────────────────────── */
    .page-header {
      text-align: center;
      margin-bottom: 2rem;
      animation: fadeUp 0.5s ease-out both;
    }

    .page-header .icon-circle {
      width: 52px; height: 52px;
      margin: 0 auto 1rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 16px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      box-shadow: 0 4px 20px var(--accent-glow);
      font-size: 1.4rem;
    }

    .page-header h1 {
      font-size: 1.85rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      margin-bottom: 0.3rem;
    }

    .page-header .subtitle {
      font-size: 0.88rem;
      color: var(--text-muted);
    }

    /* ── Stats row ───────────────────────────── */
    .stats {
      display: flex;
      gap: 0.75rem;
      margin-bottom: 1.75rem;
      animation: fadeUp 0.5s ease-out 0.08s both;
    }

    .stat-card {
      flex: 1;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 14px;
      padding: 1rem 1.1rem;
      backdrop-filter: blur(20px);
      text-align: center;
    }

    .stat-card .stat-value {
      font-size: 1.5rem;
      font-weight: 800;
      color: var(--accent-light);
      line-height: 1;
      margin-bottom: 0.25rem;
    }

    .stat-card .stat-label {
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-dim);
    }

    /* ── Toolbar ─────────────────────────────── */
    .toolbar {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 1.25rem;
      animation: fadeUp 0.5s ease-out 0.12s both;
    }

    .search-wrap {
      flex: 1;
      position: relative;
    }

    .search-wrap svg {
      position: absolute;
      left: 0.85rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: var(--text-dim);
      pointer-events: none;
    }

    .search-wrap input {
      width: 100%;
      padding: 0.65rem 0.9rem 0.65rem 2.5rem;
      font-family: inherit;
      font-size: 0.85rem;
      color: var(--text);
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      outline: none;
      transition: border-color 0.25s ease, box-shadow 0.25s ease;
    }

    .search-wrap input::placeholder { color: var(--text-dim); }

    .search-wrap input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(124, 92, 252, 0.12);
    }

    .refresh-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 40px; height: 40px;
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 12px;
      color: var(--text-muted);
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .refresh-btn:hover {
      color: var(--accent-light);
      border-color: rgba(124, 92, 252, 0.3);
      background: var(--surface-hover);
    }

    .refresh-btn svg { width: 18px; height: 18px; }

    .refresh-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Submissions list ────────────────────── */
    #list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.75rem;
    }

    #list li {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 1.25rem 1.4rem;
      backdrop-filter: blur(20px);
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.15);
      animation: fadeUp 0.4s ease-out both;
      transition: border-color 0.25s ease, box-shadow 0.25s ease, transform 0.2s ease;
    }

    #list li:hover {
      border-color: rgba(124, 92, 252, 0.2);
      box-shadow: 0 4px 24px rgba(124, 92, 252, 0.08);
      transform: translateY(-1px);
    }

    .contact-top {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
    }

    .avatar {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: linear-gradient(135deg, var(--accent), #6366f1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.85rem;
      color: #fff;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .contact-info { flex: 1; min-width: 0; }

    .contact-name {
      font-weight: 700;
      font-size: 0.95rem;
      color: var(--text);
      line-height: 1.3;
    }

    .contact-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.2rem 0.75rem;
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    .contact-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.3rem;
    }

    .contact-meta svg {
      width: 13px; height: 13px;
      opacity: 0.6;
    }

    .contact-phone {
      color: var(--accent-light) !important;
    }

    .contact-message {
      font-size: 0.88rem;
      line-height: 1.6;
      color: #c4c4d4;
      white-space: pre-wrap;
      word-break: break-word;
      padding: 0.65rem 0.85rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 10px;
      border-left: 3px solid rgba(124, 92, 252, 0.3);
      margin-bottom: 0.55rem;
    }

    .contact-date {
      font-size: 0.72rem;
      color: var(--text-dim);
      font-weight: 500;
    }

    /* ── Status messages ──────────────────────── */
    .status {
      text-align: center;
      padding: 3.5rem 1rem;
      animation: fadeUp 0.5s ease-out both;
    }

    .status-icon {
      font-size: 3rem;
      margin-bottom: 0.85rem;
      line-height: 1;
    }

    .status-text {
      font-size: 1rem;
      font-weight: 600;
    }

    .status-text.empty { color: var(--text-dim); }
    .status-text.error { color: var(--danger); }

    .status-hint {
      font-size: 0.82rem;
      color: var(--text-dim);
      margin-top: 0.35rem;
    }

    /* ── Skeleton loader ─────────────────────── */
    .skeleton-card {
      background: var(--surface);
      border: 1px solid var(--surface-border);
      border-radius: 16px;
      padding: 1.25rem 1.4rem;
      margin-bottom: 0.75rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .skeleton-row {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      margin-bottom: 0.65rem;
    }

    .skeleton-avatar {
      width: 38px; height: 38px;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.06);
      flex-shrink: 0;
    }

    .skeleton-lines { flex: 1; }

    .skeleton-line {
      height: 0.6rem;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.05);
      margin-bottom: 0.5rem;
    }

    .skeleton-line.w40 { width: 40%; }
    .skeleton-line.w60 { width: 60%; }
    .skeleton-line.w80 { width: 80%; }
    .skeleton-line:last-child { margin-bottom: 0; }

    .skeleton-body {
      height: 2.5rem;
      border-radius: 10px;
      background: rgba(255, 255, 255, 0.03);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.4; }
    }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 520px) {
      .page { padding: 5rem 1rem 2rem; }
      .page-header h1 { font-size: 1.5rem; }
      .topbar { top: 0.75rem; }
      .topbar a, .topbar button { font-size: 0.78rem; padding: 0.5rem 0.9rem; }
      .stats { gap: 0.5rem; }
      .stat-card { padding: 0.75rem 0.6rem; }
      .stat-card .stat-value { font-size: 1.25rem; }
      #list li { padding: 1rem 1.1rem; }
    }
  </style>
</head>
<body>
  <div class="bg">
    <div class="orb"></div>
    <div class="orb"></div>
    <div class="orb"></div>
  </div>

  <div class="topbar">
    <a href="form.html">✉️ Contact</a>
    <a href="view.html" class="active">📋 Submissions</a>
    <button class="logout-btn" id="logout-btn">🚪 Log out</button>
  </div>

  <div class="page">
    <div class="container">
      <div class="page-header">
        <div class="icon-circle">📋</div>
        <h1>All submissions</h1>
        <p class="subtitle" id="subtitle">Loading submissions…</p>
      </div>

      <div class="stats" id="stats" style="display: none;">
        <div class="stat-card">
          <div class="stat-value" id="stat-total">0</div>
          <div class="stat-label">Total</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-today">0</div>
          <div class="stat-label">Today</div>
        </div>
        <div class="stat-card">
          <div class="stat-value" id="stat-week">0</div>
          <div class="stat-label">This Week</div>
        </div>
      </div>

      <div class="toolbar" id="toolbar" style="display: none;">
        <div class="search-wrap">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="search" placeholder="Search by name, email, or message…" />
        </div>
        <button class="refresh-btn" id="refresh-btn" title="Refresh">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
        </button>
      </div>

      <div id="skeleton">
        <div class="skeleton-card">
          <div class="skeleton-row">
            <div class="skeleton-avatar"></div>
            <div class="skeleton-lines">
              <div class="skeleton-line w40"></div>
              <div class="skeleton-line w60"></div>
            </div>
          </div>
          <div class="skeleton-body"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-row">
            <div class="skeleton-avatar"></div>
            <div class="skeleton-lines">
              <div class="skeleton-line w40"></div>
              <div class="skeleton-line w60"></div>
            </div>
          </div>
          <div class="skeleton-body"></div>
        </div>
        <div class="skeleton-card">
          <div class="skeleton-row">
            <div class="skeleton-avatar"></div>
            <div class="skeleton-lines">
              <div class="skeleton-line w40"></div>
              <div class="skeleton-line w60"></div>
            </div>
          </div>
          <div class="skeleton-body"></div>
        </div>
      </div>

      <ul id="list"></ul>
    </div>
  </div>

  <script>
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbw-ZTgEnBZVolf729LJA0AcuT8YtqU5At3-LPhXmj7Zoye_C6GSGqZWDEMTDNkFyH93Aw/exec";

    // ── Auth gate ───────────────────────────────
    const token = localStorage.getItem("token");
    if (!token) {
      location.replace("login.html");
    }

    // ── DOM refs ────────────────────────────────
    const list       = document.getElementById("list");
    const subtitle   = document.getElementById("subtitle");
    const skeleton   = document.getElementById("skeleton");
    const statsEl    = document.getElementById("stats");
    const toolbar    = document.getElementById("toolbar");
    const searchIn   = document.getElementById("search");
    const refreshBtn = document.getElementById("refresh-btn");
    const logoutBtn  = document.getElementById("logout-btn");

    let allContacts = [];

    // ── Log out ─────────────────────────────────
    logoutBtn.addEventListener("click", () => {
      localStorage.removeItem("token");
      location.replace("login.html");
    });

    // ── Load contacts ───────────────────────────
    async function loadContacts() {
      skeleton.style.display = "";
      list.innerHTML = "";
      statsEl.style.display = "none";
      toolbar.style.display = "none";
      subtitle.textContent = "Loading submissions…";
      refreshBtn.classList.add("spinning");

      try {
        const params = new URLSearchParams({ action: "getContacts", token });
        const res  = await fetch(APPS_SCRIPT_URL + "?" + params.toString());
        const data = await res.json();

        skeleton.style.display = "none";
        refreshBtn.classList.remove("spinning");

        // Invalid / expired token → back to login
        if (!data.ok) {
          localStorage.removeItem("token");
          location.replace("login.html");
          return;
        }

        if (!data.contacts || data.contacts.length === 0) {
          subtitle.textContent = "Nothing here yet";
          list.innerHTML = `
            <div class="status">
              <div class="status-icon">📭</div>
              <div class="status-text empty">No submissions yet</div>
              <div class="status-hint">Submissions from the contact form will appear here.</div>
            </div>`;
          return;
        }

        allContacts = data.contacts;
        subtitle.textContent = `${allContacts.length} message${allContacts.length !== 1 ? "s" : ""} received`;

        updateStats(allContacts);
        statsEl.style.display = "flex";
        toolbar.style.display = "flex";

        renderContacts(allContacts);
      } catch (err) {
        skeleton.style.display = "none";
        refreshBtn.classList.remove("spinning");
        subtitle.textContent = "";
        list.innerHTML = `
          <div class="status">
            <div class="status-icon">⚠️</div>
            <div class="status-text error">Couldn't load — try again later</div>
            <div class="status-hint">Check your connection and refresh the page.</div>
          </div>`;
      }
    }

    // ── Stats ───────────────────────────────────
    function updateStats(contacts) {
      const now   = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const week  = new Date(today);
      week.setDate(week.getDate() - 7);

      let todayCount = 0, weekCount = 0;
      contacts.forEach(c => {
        const d = c.created_at ? new Date(c.created_at) : null;
        if (d) {
          if (d >= today) todayCount++;
          if (d >= week)  weekCount++;
        }
      });

      document.getElementById("stat-total").textContent = contacts.length;
      document.getElementById("stat-today").textContent  = todayCount;
      document.getElementById("stat-week").textContent   = weekCount;
    }

    // ── Render ──────────────────────────────────
    function renderContacts(contacts) {
      list.innerHTML = "";

      if (contacts.length === 0) {
        list.innerHTML = `
          <div class="status">
            <div class="status-icon">🔍</div>
            <div class="status-text empty">No matches found</div>
          </div>`;
        return;
      }

      contacts.forEach((c, i) => {
        const li = document.createElement("li");
        li.style.animationDelay = `${i * 0.04}s`;

        const initials = (c.name || "?")
          .split(" ").map(w => w[0]).join("").slice(0, 2);

        const dateStr = c.created_at
          ? new Date(c.created_at).toLocaleString()
          : "";

        li.innerHTML = `
          <div class="contact-top">
            <div class="avatar">${esc(initials)}</div>
            <div class="contact-info">
              <div class="contact-name">${esc(c.name)}</div>
              <div class="contact-meta">
                <span>
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                  ${esc(c.email)}
                </span>
                ${c.phone ? `<span class="contact-phone">
                  <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
                  ${esc(c.phone)}
                </span>` : ""}
              </div>
            </div>
          </div>
          <p class="contact-message">${esc(c.message)}</p>
          ${dateStr ? `<span class="contact-date">${dateStr}</span>` : ""}
        `;

        list.appendChild(li);
      });
    }

    // ── Search ──────────────────────────────────
    searchIn.addEventListener("input", () => {
      const q = searchIn.value.toLowerCase().trim();
      if (!q) { renderContacts(allContacts); return; }
      const filtered = allContacts.filter(c =>
        (c.name || "").toLowerCase().includes(q) ||
        (c.email || "").toLowerCase().includes(q) ||
        (c.phone || "").toLowerCase().includes(q) ||
        (c.message || "").toLowerCase().includes(q)
      );
      renderContacts(filtered);
    });

    // ── Refresh ─────────────────────────────────
    refreshBtn.addEventListener("click", () => {
      searchIn.value = "";
      loadContacts();
    });

    /** Simple HTML-escape */
    function esc(str) {
      const d = document.createElement("div");
      d.textContent = str ?? "";
      return d.innerHTML;
    }

    // ── Go ──────────────────────────────────────
    loadContacts();
  </script>
</body>
</html>
