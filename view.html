<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Submissions — DataLinkz</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --bg: #060918;
      --card: rgba(15, 18, 35, 0.85);
      --card-border: rgba(255, 255, 255, 0.06);
      --accent-1: #6366f1;
      --accent-2: #06b6d4;
      --accent-gradient: linear-gradient(135deg, #6366f1, #8b5cf6, #06b6d4);
      --text: #eef2ff;
      --text-2: #94a3b8;
      --text-3: #475569;
      --danger: #fb7185;
      --input-bg: rgba(255, 255, 255, 0.03);
      --input-border: rgba(255, 255, 255, 0.08);
      --input-focus: #818cf8;
      --glow: rgba(99, 102, 241, 0.25);
    }

    body {
      font-family: "Outfit", system-ui, sans-serif;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
    }

    /* ── Grid background ─────────────────────── */
    body::before {
      content: "";
      position: fixed; inset: 0; z-index: 0;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(99, 102, 241, 0.08) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(6, 182, 212, 0.06) 0%, transparent 50%),
        linear-gradient(rgba(255,255,255,0.02) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.02) 1px, transparent 1px);
      background-size: 100% 100%, 100% 100%, 48px 48px, 48px 48px;
    }

    /* ── Top bar ─────────────────────────────── */
    .topbar {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 100;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0.9rem 1.5rem;
      background: rgba(6, 9, 24, 0.8);
      border-bottom: 1px solid var(--card-border);
      backdrop-filter: blur(20px);
      animation: slideDown 0.4s ease-out both;
    }

    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-100%); }
      to   { opacity: 1; transform: translateY(0); }
    }

    .topbar-left {
      display: flex;
      align-items: center;
      gap: 0.55rem;
      font-size: 1.05rem;
      font-weight: 800;
      letter-spacing: -0.03em;
    }

    .topbar-left .logo-icon {
      width: 30px; height: 30px;
      border-radius: 8px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 0.85rem;
    }

    .topbar-nav {
      display: flex;
      align-items: center;
      gap: 0.2rem;
      padding: 0.2rem;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--card-border);
      border-radius: 10px;
    }

    .topbar-nav a {
      text-decoration: none;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.45rem 0.9rem;
      border-radius: 7px;
      color: var(--text-3);
      transition: all 0.2s;
    }

    .topbar-nav a:hover { color: var(--text-2); }

    .topbar-nav a.active {
      color: #fff;
      background: rgba(99, 102, 241, 0.2);
    }

    .topbar-right {
      display: flex;
      align-items: center;
      gap: 0.5rem;
    }

    .logout-btn {
      font-family: inherit;
      font-size: 0.78rem;
      font-weight: 600;
      padding: 0.45rem 0.9rem;
      border-radius: 8px;
      color: var(--danger);
      background: rgba(251, 113, 133, 0.08);
      border: 1px solid rgba(251, 113, 133, 0.12);
      cursor: pointer;
      transition: all 0.2s;
    }

    .logout-btn:hover {
      background: rgba(251, 113, 133, 0.15);
      border-color: rgba(251, 113, 133, 0.25);
    }

    /* ── Page layout ─────────────────────────── */
    .page {
      position: relative;
      z-index: 1;
      max-width: 800px;
      margin: 0 auto;
      padding: 5.5rem 1.5rem 3rem;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(18px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── Page header ─────────────────────────── */
    .page-header {
      margin-bottom: 1.75rem;
      animation: fadeUp 0.5s ease-out both;
    }

    .page-header h1 {
      font-size: 1.75rem;
      font-weight: 800;
      letter-spacing: -0.03em;
      margin-bottom: 0.2rem;
    }

    .page-header .subtitle {
      font-size: 0.9rem;
      color: var(--text-2);
    }

    /* ── Stats ───────────────────────────────── */
    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 0.75rem;
      margin-bottom: 1.5rem;
      animation: fadeUp 0.5s ease-out 0.05s both;
    }

    .stat {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.1rem 1rem;
      backdrop-filter: blur(20px);
      text-align: center;
      transition: border-color 0.2s;
    }

    .stat:hover { border-color: rgba(99, 102, 241, 0.15); }

    .stat-value {
      font-size: 1.6rem;
      font-weight: 800;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      line-height: 1;
      margin-bottom: 0.2rem;
    }

    .stat-label {
      font-size: 0.7rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-3);
    }

    /* ── Toolbar ─────────────────────────────── */
    .toolbar {
      display: flex;
      gap: 0.6rem;
      margin-bottom: 1.25rem;
      animation: fadeUp 0.5s ease-out 0.1s both;
    }

    .search-box {
      flex: 1;
      position: relative;
    }

    .search-box svg {
      position: absolute;
      left: 0.8rem;
      top: 50%;
      transform: translateY(-50%);
      width: 16px; height: 16px;
      color: var(--text-3);
      pointer-events: none;
    }

    .search-box input {
      width: 100%;
      padding: 0.6rem 0.8rem 0.6rem 2.3rem;
      font-family: inherit;
      font-size: 0.82rem;
      color: var(--text);
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      outline: none;
      transition: all 0.2s;
    }

    .search-box input::placeholder { color: var(--text-3); }

    .search-box input:focus {
      border-color: var(--input-focus);
      box-shadow: 0 0 0 3px rgba(129, 140, 248, 0.1);
    }

    .icon-btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 38px; height: 38px;
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      color: var(--text-3);
      cursor: pointer;
      transition: all 0.2s;
    }

    .icon-btn:hover {
      color: var(--input-focus);
      border-color: rgba(129, 140, 248, 0.2);
    }

    .icon-btn svg { width: 16px; height: 16px; }

    .icon-btn.spinning svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* ── Contact list ────────────────────────── */
    #list {
      list-style: none;
      display: flex;
      flex-direction: column;
      gap: 0.6rem;
    }

    #list li {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.15rem 1.25rem;
      backdrop-filter: blur(20px);
      animation: fadeUp 0.35s ease-out both;
      transition: border-color 0.2s, transform 0.2s, box-shadow 0.2s;
    }

    #list li:hover {
      border-color: rgba(99, 102, 241, 0.15);
      transform: translateY(-1px);
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
    }

    .c-top {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.6rem;
    }

    .c-avatar {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: var(--accent-gradient);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.8rem;
      color: #fff;
      flex-shrink: 0;
      text-transform: uppercase;
    }

    .c-info { flex: 1; min-width: 0; }

    .c-name {
      font-weight: 700;
      font-size: 0.92rem;
      line-height: 1.3;
    }

    .c-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.15rem 0.6rem;
      font-size: 0.75rem;
      color: var(--text-2);
    }

    .c-meta span {
      display: inline-flex;
      align-items: center;
      gap: 0.25rem;
    }

    .c-meta svg {
      width: 12px; height: 12px;
      opacity: 0.5;
    }

    .c-phone { color: #818cf8 !important; }

    .c-msg {
      font-size: 0.85rem;
      line-height: 1.6;
      color: #b0b8cc;
      padding: 0.55rem 0.8rem;
      background: rgba(255, 255, 255, 0.02);
      border-radius: 8px;
      border-left: 2px solid rgba(99, 102, 241, 0.3);
      margin-bottom: 0.45rem;
      white-space: pre-wrap;
      word-break: break-word;
    }

    .c-date {
      font-size: 0.7rem;
      color: var(--text-3);
      font-weight: 500;
    }

    /* ── Status ──────────────────────────────── */
    .status {
      text-align: center;
      padding: 3rem 1rem;
      animation: fadeUp 0.5s ease-out both;
    }

    .status-icon { font-size: 2.5rem; margin-bottom: 0.75rem; }

    .status-text {
      font-size: 0.95rem;
      font-weight: 600;
    }

    .status-text.empty { color: var(--text-3); }
    .status-text.error { color: var(--danger); }

    .status-hint {
      font-size: 0.8rem;
      color: var(--text-3);
      margin-top: 0.3rem;
    }

    /* ── Skeleton ────────────────────────────── */
    .skel {
      background: var(--card);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 1.15rem 1.25rem;
      margin-bottom: 0.6rem;
      animation: pulse 1.5s ease-in-out infinite;
    }

    .skel-row {
      display: flex;
      align-items: center;
      gap: 0.7rem;
      margin-bottom: 0.6rem;
    }

    .skel-circle {
      width: 36px; height: 36px;
      border-radius: 10px;
      background: rgba(255,255,255,0.05);
      flex-shrink: 0;
    }

    .skel-lines { flex: 1; }

    .skel-line {
      height: 0.55rem;
      border-radius: 4px;
      background: rgba(255,255,255,0.04);
      margin-bottom: 0.4rem;
    }

    .skel-line:last-child { margin-bottom: 0; }
    .skel-line.w35 { width: 35%; }
    .skel-line.w55 { width: 55%; }
    .skel-line.w80 { width: 80%; }

    .skel-block {
      height: 2rem;
      border-radius: 8px;
      background: rgba(255,255,255,0.025);
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50%      { opacity: 0.35; }
    }

    /* ── Responsive ──────────────────────────── */
    @media (max-width: 640px) {
      .page { padding: 4.5rem 1rem 2rem; }
      .page-header h1 { font-size: 1.4rem; }
      .topbar { padding: 0.75rem 1rem; }
      .topbar-left { font-size: 0.9rem; }
      .topbar-left .logo-icon { width: 26px; height: 26px; font-size: 0.75rem; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 0.5rem; }
      .stat { padding: 0.8rem 0.5rem; }
      .stat-value { font-size: 1.3rem; }
      #list li { padding: 1rem; }
    }

    @media (max-width: 420px) {
      .topbar-nav { display: none; }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <div class="topbar-left">
      <span class="logo-icon">⚡</span>
      DataLinkz
    </div>
    <nav class="topbar-nav">
      <a href="form.html">Contact</a>
      <a href="view.html" class="active">Submissions</a>
    </nav>
    <div class="topbar-right">
      <button class="logout-btn" id="logout-btn">Log out</button>
    </div>
  </div>

  <div class="page">
    <div class="page-header">
      <h1>All submissions</h1>
      <p class="subtitle" id="subtitle">Loading…</p>
    </div>

    <div class="stats" id="stats" style="display: none;">
      <div class="stat">
        <div class="stat-value" id="stat-total">0</div>
        <div class="stat-label">Total</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-today">0</div>
        <div class="stat-label">Today</div>
      </div>
      <div class="stat">
        <div class="stat-value" id="stat-week">0</div>
        <div class="stat-label">This Week</div>
      </div>
    </div>

    <div class="toolbar" id="toolbar" style="display: none;">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input type="text" id="search" placeholder="Search submissions…" />
      </div>
      <button class="icon-btn" id="refresh-btn" title="Refresh">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a9 9 0 1 1-6.219-8.56"/><polyline points="21 3 21 9 15 9"/></svg>
      </button>
    </div>

    <div id="skeleton">
      <div class="skel"><div class="skel-row"><div class="skel-circle"></div><div class="skel-lines"><div class="skel-line w35"></div><div class="skel-line w55"></div></div></div><div class="skel-block"></div></div>
      <div class="skel"><div class="skel-row"><div class="skel-circle"></div><div class="skel-lines"><div class="skel-line w35"></div><div class="skel-line w55"></div></div></div><div class="skel-block"></div></div>
      <div class="skel"><div class="skel-row"><div class="skel-circle"></div><div class="skel-lines"><div class="skel-line w35"></div><div class="skel-line w55"></div></div></div><div class="skel-block"></div></div>
    </div>

    <ul id="list"></ul>
  </div>

  <script>
    const APPS_SCRIPT_URL =
      "https://script.google.com/macros/s/AKfycbw-ZTgEnBZVolf729LJA0AcuT8YtqU5At3-LPhXmj7Zoye_C6GSGqZWDEMTDNkFyH93Aw/exec";

    /* ── Auth gate ─────────────────────────── */
    const token = localStorage.getItem("token");
    if (!token) location.replace("login.html");

    /* ── DOM ────────────────────────────────── */
    const list       = document.getElementById("list");
    const subtitle   = document.getElementById("subtitle");
    const skeleton   = document.getElementById("skeleton");
    const statsEl    = document.getElementById("stats");
    const toolbar    = document.getElementById("toolbar");
    const searchIn   = document.getElementById("search");
    const refreshBtn = document.getElementById("refresh-btn");

    let allContacts = [];

    /* ── Log out ───────────────────────────── */
    document.getElementById("logout-btn").addEventListener("click", () => {
      localStorage.removeItem("token");
      location.replace("login.html");
    });

    /* ── Load ──────────────────────────────── */
    async function load() {
      skeleton.style.display = "";
      list.innerHTML = "";
      statsEl.style.display = "none";
      toolbar.style.display = "none";
      subtitle.textContent = "Loading…";
      refreshBtn.classList.add("spinning");

      try {
        const params = new URLSearchParams({ action: "getContacts", token });
        const res  = await fetch(APPS_SCRIPT_URL + "?" + params.toString());
        const data = await res.json();

        skeleton.style.display = "none";
        refreshBtn.classList.remove("spinning");

        if (!data.ok) {
          localStorage.removeItem("token");
          location.replace("login.html");
          return;
        }

        if (!data.contacts || data.contacts.length === 0) {
          subtitle.textContent = "Nothing here yet";
          list.innerHTML = `<div class="status"><div class="status-icon">📭</div><div class="status-text empty">No submissions yet</div><div class="status-hint">Submissions from the contact form will appear here.</div></div>`;
          return;
        }

        allContacts = data.contacts;
        subtitle.textContent = `${allContacts.length} message${allContacts.length !== 1 ? "s" : ""} received`;
        computeStats(allContacts);
        statsEl.style.display = "";
        toolbar.style.display = "";
        render(allContacts);
      } catch {
        skeleton.style.display = "none";
        refreshBtn.classList.remove("spinning");
        subtitle.textContent = "";
        list.innerHTML = `<div class="status"><div class="status-icon">⚠️</div><div class="status-text error">Couldn't load — try again later</div><div class="status-hint">Check your connection and refresh.</div></div>`;
      }
    }

    /* ── Stats ─────────────────────────────── */
    function computeStats(c) {
      const now = new Date();
      const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
      const week  = new Date(today); week.setDate(week.getDate() - 7);
      let td = 0, wk = 0;
      c.forEach(x => {
        const d = x.created_at ? new Date(x.created_at) : null;
        if (d) { if (d >= today) td++; if (d >= week) wk++; }
      });
      document.getElementById("stat-total").textContent = c.length;
      document.getElementById("stat-today").textContent  = td;
      document.getElementById("stat-week").textContent   = wk;
    }

    /* ── Render ────────────────────────────── */
    function render(contacts) {
      list.innerHTML = "";
      if (!contacts.length) {
        list.innerHTML = `<div class="status"><div class="status-icon">🔍</div><div class="status-text empty">No matches found</div></div>`;
        return;
      }
      contacts.forEach((c, i) => {
        const li = document.createElement("li");
        li.style.animationDelay = `${i * 0.035}s`;
        const initials = (c.name || "?").split(" ").map(w => w[0]).join("").slice(0, 2);
        const date = c.created_at ? new Date(c.created_at).toLocaleString() : "";
        li.innerHTML = `
          <div class="c-top">
            <div class="c-avatar">${esc(initials)}</div>
            <div class="c-info">
              <div class="c-name">${esc(c.name)}</div>
              <div class="c-meta">
                <span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>${esc(c.email)}</span>
                ${c.phone ? `<span class="c-phone"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6A19.79 19.79 0 0 1 2.12 4.18 2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>${esc(c.phone)}</span>` : ""}
              </div>
            </div>
          </div>
          <div class="c-msg">${esc(c.message)}</div>
          ${date ? `<span class="c-date">${date}</span>` : ""}`;
        list.appendChild(li);
      });
    }

    /* ── Search ────────────────────────────── */
    searchIn.addEventListener("input", () => {
      const q = searchIn.value.toLowerCase().trim();
      if (!q) { render(allContacts); return; }
      render(allContacts.filter(c =>
        (c.name||"").toLowerCase().includes(q) ||
        (c.email||"").toLowerCase().includes(q) ||
        (c.phone||"").toLowerCase().includes(q) ||
        (c.message||"").toLowerCase().includes(q)
      ));
    });

    refreshBtn.addEventListener("click", () => { searchIn.value = ""; load(); });

    function esc(s) { const d = document.createElement("div"); d.textContent = s ?? ""; return d.innerHTML; }

    load();
  </script>
</body>
</html>
